# Gera o Contas.xcodeproj com XcodeGen (brew install xcodegen; xcodegen generate)
name: Contas
options:
  bundleIdPrefix: com.rhpl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Preencha com o Team ID da sua conta Apple Developer antes de gerar o build para TestFlight
    # DEVELOPMENT_TEAM: XXXXXXXXXX
targets:
  Contas:
    type: application
    platform: iOS
    sources:
      - path: Contas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhpl.contas
        PRODUCT_NAME: Contas
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
